# Motor de alcohol. El alcohol NO toca el cuerpo: solo cambia cómo transmiten las neuronas, por clase
# de neurotransmisor. Caerse, tambalearse o quedarse quieta sale de lo que eso hace a las
# motoneuronas reales. Curvas lineales a trozos sobre el nivel a (0 = sobria, 1 = máximo).
k_abs: 0.25          # 1/s, buche -> hemolinfa
k_elim: 0.0012       # 1/s, eliminación lineal (FICCIÓN: acelerada para que se vea en minutos)
hangover: {high: 0.5, low: 0.15, duration_s: 30}   # solo etiqueta de la interfaz, no actúa

# Etapas: SOLO son el nombre que la interfaz pone a cada nivel. No disparan nada.
stages:
  - {id: sobria,   name: "Sobria",   min: 0.00, color: "#8fd19e"}
  - {id: piripi,   name: "Piripi",   min: 0.08, color: "#f2d06b"}
  - {id: pedo,     name: "Pedo",     min: 0.30, color: "#f39c4a"}
  - {id: borracha, name: "Borracha", min: 0.60, color: "#e8534a"}
  - {id: ko,       name: "KO",       min: 0.90, color: "#9b6ad6"}
  - {id: resaca,   name: "Resaca",   min: null, color: "#7f9bb3"}

# abv y azúcar deciden el SABOR (dulce/amargo en las gustativas); dose, cuánto alcohol entra.
drinks:
  - {id: beer,     name: "Cerveza",       emoji: "🍺", color: "#e0a030", dose: 0.08, abv: 0.05, sugar: 0.55, impurity: 0.0}
  - {id: wine,     name: "Vino",          emoji: "🍷", color: "#7a1030", dose: 0.12, abv: 0.12, sugar: 0.50, impurity: 0.0}
  - {id: shot,     name: "Chupito de licor", emoji: "🥃", color: "#cfe8ff", dose: 0.25, abv: 0.25, sugar: 0.80, impurity: 0.0}
  - {id: tequila,  name: "Tequila doble", emoji: "🌵", color: "#e8c070", dose: 0.30, abv: 0.40, sugar: 0.30, impurity: 0.05}
  - {id: garrafon, name: "Garrafón",      emoji: "🧪", color: "#5fd94a", dose: 0.45, abv: 0.40, sugar: 0.20, impurity: 0.25}

curve_points: [0.0, 0.3, 0.6, 0.9, 1.0]
neural:
  # octopamina, dopamina y serotonina: con poco alcohol suben (hiperactividad), con mucho bajan
  monoamina_x:    [1.0, 1.30, 1.15, 0.80, 0.60]
  # transmisión excitadora (acetilcolina): el etanol la deprime a dosis altas
  excitacion_x:   [1.0, 1.00, 0.85, 0.55, 0.35]
  # transmisión inhibidora (GABA, glutamato, histamina): algo de desinhibición al principio,
  # potenciación GABAérgica a dosis altas (sedación)
  inhibicion_x:   [1.0, 0.85, 1.00, 1.35, 1.60]
  # ruido sináptico multiplicativo de media cero: desordena la señal sin subir la tasa media
  ruido:          [0.0, 0.05, 0.20, 0.35, 0.40]
  # los sentidos llegan con retraso (ms)
  retardo_ms:     [0, 60, 150, 300, 400]
  # el olfato pierde sensibilidad
  olfato_x:       [1.0, 1.00, 0.85, 0.50, 0.30]
