# Protocolo automático. Fase 1 (0-60 s): ingesta voluntaria. La mosca decide con MN9 si bebe y
# se sacia (y el garrafón lo rechaza por amargo). Fase 2 (70-245 s): exposición a vapor de etanol en
# pulsos de 20 s, como en el ensayo de pérdida del reflejo de enderezamiento: el etanol entra aunque
# no beba, y se ve la progresión completa.
puddle_distance: [22, 60]   # la gota se deja cerca de la mosca
orders:
  - {t: 1, kind: beer}
  - {t: 8, kind: wine}
  - {t: 16, kind: shot}
  - {t: 26, kind: beer}
  - {t: 36, kind: wine}
  - {t: 46, kind: shot}
  - {t: 56, kind: garrafon}
  - {t: 70, vapor: 20}
  - {t: 120, vapor: 20}
  - {t: 170, vapor: 20}
  - {t: 220, vapor: 25}
  - {t: 265, vapor: 25}
